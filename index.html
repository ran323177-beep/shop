<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资源商城</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #1677ff;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        main {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px #ddd;
        }

        .price {
            color: #f56c6c;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            width: 100%;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>我的资源商城</h1>
    <p>精选数字资源，方便快捷</p>
</header>

<main>

    <div class="product">
        <h2>Python学习资料</h2>
        <p>适合初学者的Python学习资源。</p>
        <p class="price">¥9.90</p>
        <button onclick="alert('商品详情页面正在建设中')">
            查看详情
        </button>
    </div>

    <div class="product">
        <h2>设计素材合集</h2>
        <p>个人设计作品与素材合集。</p>
        <p class="price">¥19.90</p>
        <button onclick="alert('商品详情页面正在建设中')">
            查看详情
        </button>
    </div>

</main>

<footer>
    <p>© 2026 我的资源商城</p>
</footer>

</body>
</html>
