<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青衿资源库</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f7fb;
    color: #263445;
}

header {
    background: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px #e5eaf2;
}

.logo {
    color: #2878e8;
    font-size: 23px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #555;
    margin-left: 12px;
    font-size: 14px;
}

.banner {
    background: linear-gradient(120deg,#2878e8,#65a6ff);
    color: white;
    text-align: center;
    padding: 45px 15px;
}

.banner h1 { font-size: 30px; }

.search {
    max-width: 550px;
    margin: 25px auto 0;
    display: flex;
}

.search input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 8px 0 0 8px;
    font-size: 15px;
}

.search button {
    background: #155fc2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
}
.announcement {
    max-width: 1000px;
    margin: 20px auto 0;
    padding: 16px 20px;
    background: #eaf3ff;
    border: 1px solid #cfe2ff;
    border-radius: 10px;
    color: #315f98;
    font-size: 14px;
    line-height: 1.7;
}

.announcement-label {
    font-weight: bold;
    margin-right: 10px;
    color: #2878e8;
}
main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 15px;
}

.categories {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.categories button {
    background: white;
    border: 1px solid #e0e7f1;
    padding: 10px 18px;
    border-radius: 20px;
    color: #397bd5;
    cursor: pointer;
}

.categories button.active {
    background: #2878e8;
    color: white;
}

h2 { font-size: 21px; }

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 18px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #e8edf5;
}

.icon { font-size: 38px; }

.card h3 { margin-bottom: 8px; }

.card p {
    color: #68788d;
    line-height: 1.6;
}

.price {
    color: #ed654e;
    font-size: 22px;
    font-weight: bold;
    margin: 15px 0;
}

.card button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #2878e8;
    color: white;
    border-radius: 7px;
    cursor: pointer;
}

.card button:hover {
    background: #155fc2;
}

#emptyMessage {
    display: none;
    text-align: center;
    color: #8996a8;
    padding: 35px 10px;
    grid-column: 1 / -1;
}

footer {
    background: white;
    text-align: center;
    padding: 25px;
    color: #888;
    margin-top: 40px;
}

@media(max-width:600px) {
    header { flex-wrap: wrap; gap: 12px; }
    nav a { margin-left: 8px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">📘 青衿资源库</div>
    <nav>
        <a href="index.html">首页</a>
        <a href="#products">资源商城</a>
        <a href="help.html">帮助中心</a>
    </nav>
</header>

<section class="banner">
    <h1>青衿资源库</h1>
    <p>精选优质数字资源，探索更多可能</p>

    <div class="search">
        <input id="searchInput"
        placeholder="搜索商品名称、介绍或分类..."
        oninput="searchProducts()">

        <button onclick="searchProducts()">搜索</button>
    </div>
</section>
 <div class="announcement">
    <span class="announcement-label">📢 网站公告</span>
    <span>欢迎来到青衿资源库！本站持续整理和更新优质学习资料与实用资源。</span>
</div>   

<main>

    <div class="categories" id="categories">
        <button class="active" onclick="filterProducts('全部',this)">全部资源</button>
        <button onclick="filterProducts('学习资料',this)">学习资料</button>
        <button onclick="filterProducts('设计素材',this)">设计素材</button>
        <button onclick="filterProducts('其他',this)">其他资源</button>
    </div>

    <h2 id="products">热门资源</h2>

    <div class="products" id="productList"></div>

    <div id="emptyMessage">
        没有找到相关商品，试试其他关键词吧。
    </div>

</main>

<footer>
    <p>青衿资源库 © 2026</p>
    <p>分享优质资源，传递知识价值</p>
</footer>
<script>
let products = [];
let currentCategory = "全部";

// 从 products.json 读取商品
async function loadProducts() {
    const list = document.getElementById("productList");

    try {
        const response = await fetch("./products.json");

        if (!response.ok) {
            throw new Error("商品数据读取失败");
        }

        products = await response.json();
        renderProducts();

    } catch (error) {
        list.innerHTML = "商品加载失败，请稍后刷新页面。";
        console.error(error);
    }
}

// 显示商品
function renderProducts() {
    const list = document.getElementById("productList");
    const keyword = document.getElementById("searchInput").value
        .trim().toLowerCase();

    list.innerHTML = "";

    const filtered = products.filter(product => {
        const matchCategory =
            currentCategory === "全部" ||
            product.category === currentCategory;

        const text = (
            product.name + " " +
            product.category + " " +
            product.description
        ).toLowerCase();

        return matchCategory && text.includes(keyword);
    });

    filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = product.icon || "📦";

        const name = document.createElement("h3");
        name.textContent = product.name;

        const description = document.createElement("p");
        description.textContent = product.description;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent =
            "¥" + Number(product.price).toFixed(2);

        const button = document.createElement("button");
        button.textContent = "查看详情";

        button.addEventListener("click", () => {
            location.href = "detail.html?id=" +
                encodeURIComponent(product.id);
        });

        card.append(icon, name, description, price, button);
        list.appendChild(card);
    });

    document.getElementById("emptyMessage").style.display =
        filtered.length === 0 ? "block" : "none";
}

// 搜索
function searchProducts() {
    renderProducts();
}

// 分类筛选
function filterProducts(category, button) {
    currentCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(item => item.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
}

// 加载商品
loadProducts();
</script>
<div id="noticePopup" class="notice-mask">
    <div class="notice-box">
        <div class="notice-title">📢 网站公告</div>
        <p>欢迎来到青衿资源库！本站持续整理和更新优质学习资料与实用资源。</p>
        <button onclick="closeNotice()">我知道了</button>
    </div>
</div>

<style>
.notice-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.notice-box {
    width: 85%;
    max-width: 380px;
    background: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.notice-title {
    font-size: 21px;
    font-weight: bold;
    color: #2878e8;
    margin-bottom: 15px;
}

.notice-box p {
    color: #555;
    line-height: 1.8;
}

.notice-box button {
    margin-top: 15px;
    padding: 10px 30px;
    border: none;
    border-radius: 8px;
    background: #2878e8;
    color: white;
    font-size: 15px;
}
</style>

<script>
function closeNotice() {
    document.getElementById("noticePopup").style.display = "none";
}
</script>

</body>
</html>
